[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanomemory"
version = "0.1.0"
description = "A lightweight, persistent and token-efficient memory engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NanoMemory Contributors" }]
keywords = ["ai", "agents", "memory", "llm", "token-efficiency"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "openai>=1.30",
    "filelock>=3.13",
    "httpx>=0.27",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://example.invalid/nanomemory"
Documentation = "https://example.invalid/nanomemory/docs"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["nanomemory*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:nanomemory.*"]

[tool.coverage.run]
branch = true
source = ["nanomemory"]
omit = ["nanomemory/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["nanomemory", "tests", "benchmarks", "scripts"]
extend-exclude = [
    "storage",
    "reports",
    ".venv",
    ".tmpx",
    ".pytest-tmp",
    ".pytest-tmp2",
    ".pt-run1",
    ".probe-mode",
    ".piptmp",
    ".uvcache",
    ".pyshim",
    "benchmarks/results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]
# ASYNC240: a few deliberate, bounded blocking filesystem calls remain in CLI/benchmark and
# tool-handler code paths whose surrounding interface is synchronous anyway.
ignore = ["ASYNC240"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires calling Query()/Depends() in signature defaults.
"nanomemory/api/**" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["nanomemory", "benchmarks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
