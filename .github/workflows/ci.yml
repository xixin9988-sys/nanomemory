name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test-py311:
    name: tests (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        run: python scripts/ci_junit_annotations.py junit.xml

  test-py312:
    name: tests (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        run: python scripts/ci_junit_annotations.py junit.xml

  contract:
    name: repository contract (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/contract -q

  eval:
    name: eval gate (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "."
      - name: Run the frozen eval set (offline provider)
        run: |
          python evals/run_eval.py --k 5 \
            --min-recall 0.85 --min-refusal 0.80 \
            --report evals/reports/ci-hashing.md \
            --json evals/reports/ci-hashing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/ci-hashing.*
